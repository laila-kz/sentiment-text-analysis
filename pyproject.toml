[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-text-analysis"
version = "1.0.0"
description = "Multi-model, calibrated sentiment and emotion analysis for text and speech."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dashboard = ["streamlit>=1.37", "pandas>=2.0", "plotly>=5.20"]
asr = ["faster-whisper>=1.0"]
serve = ["sentiment-text-analysis[api,dashboard]"]

[project.scripts]
sentiment-analyse = "cli:main"

[tool.setuptools]
py-modules = [
    "app",
    "batchio",
    "charts",
    "cli",
    "config",
    "observability",
    "schemas",
    "sentiment",
    "transcribe",
    "utils",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "SIM117", "C402", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["api", "app", "batchio", "charts", "cli", "config", "observability", "schemas", "sentiment", "transcribe", "utils"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^\\.venv/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["app", "charts", "transcribe"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]
