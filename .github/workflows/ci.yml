name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ui.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "pydantic>=2.7" "python-multipart>=0.0.9" "httpx>=0.27"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check --diff .

      - name: Mypy
        run: mypy .

      - name: Tests
        run: pytest -q --cov=api --cov=sentiment --cov=utils --cov=batchio --cov=schemas --cov=observability --cov=cli --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sentiment-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name sentiment-ci -p 8000:8000 sentiment-platform:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "service healthy after ${attempt} attempt(s)"
              curl -fsS http://127.0.0.1:8000/v1/models
              docker rm -f sentiment-ci
              exit 0
            fi
            sleep 5
          done
          echo "service did not become healthy in time"
          docker logs sentiment-ci
          docker rm -f sentiment-ci
          exit 1
